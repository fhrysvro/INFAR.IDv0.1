<!DOCTYPE html>
<html lang="id">
<head>

	<meta property="og:title" content="INFAR.ID">
<meta property="og:description" content="Website sederhana yang berisi informasi dan pembelajaran kosa kata">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - KOFAHUM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      background-image: 
        radial-gradient(at 0% 0%, rgba(186, 230, 253, 0.8) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(191, 219, 254, 0.7) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(248, 250, 252, 0.6) 0px, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    .ios-pure-glass {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(255, 255, 255, 0.45) 45%,
        rgba(255, 255, 255, 0.65) 100%
      );
      backdrop-filter: blur(40px) saturate(230%);
      -webkit-backdrop-filter: blur(40px) saturate(230%);
      border-radius: 36px;
      border-top: 2px solid rgba(255, 255, 255, 1);
      border-left: 2px solid rgba(255, 255, 255, 0.95);
      border-right: 1.5px solid rgba(255, 255, 255, 0.5);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 
        0 25px 50px rgba(15, 23, 42, 0.08),
        0 10px 20px rgba(37, 99, 235, 0.05),
        inset 0 2px 3px rgba(255, 255, 255, 1);
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    @media (min-width: 576px) {
      .ios-pure-glass { padding: 44px 38px; }
    }

    .app-icon {
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 1);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #2563eb;
      font-size: 32px;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.12), inset 0 2px 2px rgba(255, 255, 255, 1);
    }

    .input-wrapper { position: relative; margin-bottom: 16px; }
    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      z-index: 5;
    }

    .ios-input-glass {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      color: #0f172a;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .ios-input-glass::placeholder { color: #94a3b8; }
    .ios-input-glass:focus {
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .btn-ios-glass {
      width: 100%;
      padding: 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
    }

    .btn-ios-glass:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.35);
    }

    .btn-google-glass {
      width: 100%;
      padding: 13px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.8);
      color: #334155;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-google-glass:hover { background: #ffffff; }
  </style>
</head>
<body>

  <div class="ios-pure-glass text-center">
    <div class="app-icon">
      <i class="fa-solid fa-scale-balanced"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">KOFAHUM</h3>
    <p class="text-secondary small mb-4">Kosa Kata Fahri - Hukum & Pemerintahan</p>

    <div id="alertBox" class="alert d-none text-start small rounded-4 mb-3"></div>

    <button id="btnGoogle" class="btn-google-glass mb-3">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
      <span>Masuk dengan Google</span>
    </button>

    <div class="d-flex align-items-center my-3 text-secondary small">
      <hr class="flex-grow-1 border-secondary my-0 opacity-25">
      <span class="px-2 fs-7">atau Email</span>
      <hr class="flex-grow-1 border-secondary my-0 opacity-25">
    </div>

    <form id="loginForm">
      <div class="input-wrapper text-start">
        <input type="email" id="email" class="ios-input-glass" placeholder="Email" required autocomplete="email">
        <i class="fa-regular fa-envelope"></i>
      </div>
      <div class="input-wrapper text-start mb-4">
        <input type="password" id="password" class="ios-input-glass" placeholder="Kata Sandi" required autocomplete="current-password">
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="submit" class="btn-ios-glass mb-3" id="btnLogin">Masuk</button>
    </form>

    <p class="small text-secondary mb-0">
      Belum punya akun? <a href="register.html" class="text-primary fw-bold text-decoration-none">Daftar</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6sXokemVHq86ieQFG1IcRLgP_l1fSJ64",
      authDomain: "kofa-a3de8.firebaseapp.com",
      projectId: "kofa-a3de8",
      storageBucket: "kofa-a3de8.firebasestorage.app",
      messagingSenderId: "699376168574",
      appId: "1:699376168574:web:baa00693be82b6eed6322f",
      databaseURL: "https://kofa-a3de8-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence);

    const googleProvider = new GoogleAuthProvider();
    const alertBox = document.getElementById('alertBox');

    // Cek status auth instan
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace('dashboard.html');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Memproses...`;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.replace('dashboard.html');
      } catch (err) {
        alertBox.classList.remove('d-none');
        alertBox.className = 'alert alert-danger small rounded-4 mb-3 border-0 shadow-sm';
        alertBox.textContent = 'Email atau kata sandi tidak cocok.';
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });

    document.getElementById('btnGoogle').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
        window.location.replace('dashboard.html');
      } catch (err) {
        alertBox.classList.remove('d-none');
        alertBox.className = 'alert alert-danger small rounded-4 mb-3 border-0 shadow-sm';
        alertBox.textContent = 'Gagal masuk dengan Google.';
      }
    });
  </script>
</body>
</html>
